name: CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  sidecar:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - run: python -m pip install numpy==2.2.6 opencv-python-headless==4.12.0.88
      - run: npm ci --no-audit
      - run: npm test
      - run: npm run typecheck
      - run: npm run test:service-unit
      - run: npm pack
      - uses: actions/upload-artifact@v4
        with:
          name: sidecar-node-${{ matrix.node }}
          path: tracker-mcp-*.tgz
